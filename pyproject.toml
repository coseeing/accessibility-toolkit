[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessibility-toolkit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "wxPython",
  "pyinstaller",
  "pyttsx3",
  "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"accessibility_toolkit.output.speech.windows" = ["vendor/nvda/x64/*.dll"]
"apps.nvda_remote" = ["waves/*.wav", "waves/NOTICE.md", "waves/NVDA-COPYING.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
