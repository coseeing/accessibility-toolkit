[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessibility-toolkit-wx"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "accessibility-toolkit-core==0.1.0",
  "wxPython",
]

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["accessibility_toolkit_wx*"]
